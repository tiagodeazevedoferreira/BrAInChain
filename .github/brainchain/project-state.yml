project:
  name: BrAInChain
  phase: autonomous_project_control
  objective: >-
    Operate the research pipeline autonomously from collection through data
    readiness, audit recovery, PR/CI recovery, and bounded escalation.

collection:
  workflow: collect-market.yml
  cadence: hourly
  listings: 100
  manual_collection_allowed: false

horizons:
  1h:
    required_history_hours: 1
  6h:
    required_history_hours: 6
  24h:
    required_history_hours: 24
  72h:
    required_history_hours: 72
  168h:
    required_history_hours: 168

label_methodology:
  one_hour_return_threshold: 0.0025
  one_hour_return_threshold_percent: 0.25
  decision: human_approved
  evidence: >-
    Threshold calibration produced 199 eligible observations with the most
    balanced tested class distribution at 0.25%: down=17, neutral=91, up=91.
  promoted_on: 2026-08-19

agent_policy:
  poll_interval_minutes: 30
  auto_dispatch_audits: true
  auto_retry_transient_workflows_once: true
  auto_modify_source_code: false
  auto_merge_pull_requests: false
  auto_modify_collection_frequency: false
  auto_change_label_thresholds: false
  auto_change_secrets: false
  human_required_for:
    - API quota or billing changes
    - credentials or secrets
    - collection-frequency changes
    - label methodology changes
    - destructive data operations
    - persistent CI failures requiring source changes
    - model or threshold promotion decisions

readiness_policy:
  audit_workflow: firebase-dataset-audit.yml
  audit_max_assets: 0
  dispatch_when_new_horizon_is_reached: true
  horizons_in_order:
    - 1h
    - 6h
    - 24h
    - 72h
    - 168h

phase_2:
  name: pr_ci_agent
  workflow: pr-ci-guardian.yml
  specification: brainchain-pr-ci-agent.md
  bounded_retry_attempts: 1
  automatic_merge: false

phase_3:
  name: autonomous_project_agent
  workflow: project-autonomy.yml
  specification: brainchain-project-agent.md
  objective: >-
    Unify collection health, readiness progression, audit recovery and PR/CI
    recovery into one bounded control loop that escalates only at policy boundaries.
