name: Project Autonomy Control Plane

on:
  workflow_run:
    workflows:
      - "Collect Crypto Market"
      - "BrainChain Data Readiness"
      - "Firebase Dataset Audit"
      - "Asset History Depth Audit"
      - "Temporal Label Audit"
      - "1h Label Distribution Audit"
      - "1h Threshold Calibration v2"
      - "CI"
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: brainchain-project-autonomy
  cancel-in-progress: false

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate project state and route automation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          # Deterministic control plane: no source-code, secret, cadence,
          # threshold, or destructive-data changes are permitted here.
          recent_failures=$(gh run list --repo "$REPOSITORY" --limit 50 --json name,conclusion,status,url \
            --jq '[.[] | select(.conclusion == "failure")] | length')

          if [ "$recent_failures" -ge 3 ]; then
            title="[Project Autonomy] Multiple workflow failures require investigation"
            body=$(cat <<EOF
The autonomous control plane detected ${recent_failures} failed workflow runs in the recent run window.

The system will not modify source code, secrets, collection cadence, label methodology, or data destructively.
Review the failing workflows and resolve the root cause before allowing further autonomous progression.
EOF
            )
            if ! gh issue list --repo "$REPOSITORY" --state open --limit 50 --search "in:title \"$title\"" | grep -q .; then
              gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
            fi
          fi

          # The readiness workflow is primarily chained directly from a
          # successful collection. This control-plane fallback is intentionally
          # limited to that event, avoiding repeated hourly dispatches.
          if [ "$EVENT_NAME" = "workflow_run" ] && \
             [ "$TRIGGER_WORKFLOW" = "Collect Crypto Market" ] && \
             [ "$TRIGGER_CONCLUSION" = "success" ]; then
            gh workflow run "brainchain-data-readiness.yml" --repo "$REPOSITORY"
          fi
