name: PR CI Guardian

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry first CI failure
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"

      - name: Escalate persistent CI failure
        if: ${{ github.event.workflow_run.run_attempt > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          prs=$(gh run view "$RUN_ID" --repo "$REPOSITORY" --json pullRequests --jq '.pullRequests[].number' || true)
          for pr in $prs; do
            marker='<!-- brainchain-pr-ci-guardian -->'
            existing=$(gh pr view "$pr" --repo "$REPOSITORY" --json comments --jq '.comments[].body' || true)
            if printf '%s\n' "$existing" | grep -Fq "$marker"; then
              continue
            fi
            gh pr comment "$pr" --repo "$REPOSITORY" --body "$marker

CI failed again after the automatic recovery attempt.

- Branch: ${BRANCH}
- Run: ${RUN_URL}
- Run ID: ${RUN_ID}

Automatic reruns are exhausted. Investigation is required."
          done
