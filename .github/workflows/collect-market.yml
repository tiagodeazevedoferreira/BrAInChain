name: Collect Crypto Market

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of CMC listings to collect"
        required: false
        default: "100"
  schedule:
    # Hourly collection keeps the first historical dataset conservative on API usage.
    - cron: "17 * * * *"

concurrency:
  group: crypto-market-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and persist snapshots
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: python scripts/collect_market.py --limit "${{ inputs.limit || '100' }}"
