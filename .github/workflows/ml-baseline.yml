name: ML Baseline CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/brainchain/modeling.py'
      - 'tests/test_modeling.py'
      - 'requirements.txt'
      - '.github/workflows/ml-baseline.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q tests/test_modeling.py
