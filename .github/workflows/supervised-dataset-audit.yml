name: Supervised Dataset Audit

on:
  workflow_dispatch:
    inputs:
      max_assets:
        description: "Maximum number of assets to audit (0 = all)"
        required: false
        default: "0"
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit real Firebase supervised dataset
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: PYTHONPATH=src python scripts/audit_supervised_dataset.py --max-assets "${{ inputs.max_assets }}"
