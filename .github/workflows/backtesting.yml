name: Backtesting CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/brainchain/backtesting.py"
      - "tests/test_backtesting.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q tests/test_backtesting.py
